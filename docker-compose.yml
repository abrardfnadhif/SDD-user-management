version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: user-mgmt-db
    environment:
      POSTGRES_USER: user_mgmt
      POSTGRES_PASSWORD: dev_password_change_in_prod
      POSTGRES_DB: user_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_mgmt -d user_management"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: user-mgmt-backend
    environment:
      DATABASE_URL: postgresql://user_mgmt:dev_password_change_in_prod@postgres:5432/user_management
      APP_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/venv
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - app-network
    profiles:
      - full

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: user-mgmt-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev
    networks:
      - app-network
    profiles:
      - full

  # Optional: Redis for distributed rate limiting
  redis:
    image: redis:7-alpine
    container_name: user-mgmt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-network
    profiles:
      - full
      - redis

volumes:
  postgres_data:
  backend_venv:
  frontend_modules:
  redis_data:

networks:
  app-network:
    driver: bridge
